name: Publish H3 OBVPM Director to Comfy Registry

# Manual release only: pushing to main must NOT auto-publish a version.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-node:
    name: Publish Custom Node
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Publish Custom Node to Comfy Registry
        uses: Comfy-Org/publish-node-action@v1
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
